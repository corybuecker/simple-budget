<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
	{% if let Some(csrf) = layout.csrf_token %}
        <meta name="csrf-token" content="{{ csrf }}" />
        {% endif %}
    </head>
    <body>
        {% block content %}{% endblock %}
    <script type="module" src="assets/index.ts" nonce="{{ layout.nonce }}"></script>
    </body>
</html>
