{{- $root := . -}}
{{- range $slot := .Values.deployments }}
{{- if $slot.enabled }}
{{- $ctx := dict "root" $root "slot" $slot }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "simple-budget.slotName" $ctx }}
  labels:
    {{- include "simple-budget.labels" $root | nindent 4 }}
    version: {{ $slot.name }}
spec:
  type: {{ $root.Values.service.type }}
  ports:
    - name: http
      port: {{ $root.Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "simple-budget.slotSelectorLabels" $ctx | nindent 4 }}
{{- end }}
{{- end }}
