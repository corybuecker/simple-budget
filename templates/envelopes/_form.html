{% if let Some(csrf) = layout.csrf_token %}
    <input type="hidden" name="csrf" value="{{ csrf }}">
{% endif %}
<div>
    <h1>
        Envelopes
        {% if !name.is_empty() %}<div>{{ name }}</div>{% endif %}
    </h1>
    <div id="errors">
        {% if !errors.is_empty() %}<div>{{ errors }}</div>{% endif %}
    </div>
    <div>
        <label for="name">Envelope Name</label>
        <input id="name"
               name="name"
               required
               type="text"
               value="{{ name }}"
               placeholder="Enter envelope name" />
    </div>
    <div data-controller="currency-input"
         data-currency-input-precision-value="2">
        <label for="amount">Amount</label>
        <div>
            <span>$</span>
            <input id="amount"
                   data-currency-input-target="input"
                   name="amount"
                   pattern="\d*"
                   required
                   type="number"
                   step="0.01"
                   data-action="currency-input#change"
                   value="{{ amount }}"
                   placeholder="0.00" />
        </div>
        <div data-currency-input-target="output"></div>
    </div>
    <div>
        <a href="/envelopes">Cancel</a>
        <input type="submit" value="Save Envelope" />
    </div>
</div>
