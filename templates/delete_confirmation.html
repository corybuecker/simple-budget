{% extends "layout.html" %}
{% block content %}
    <div>
        <p>{{ prompt }}</p>
        <div>
            <a href="{{ cancel }}">Keep {{ entity }}</a>
            <form method="post" action="{{ action }}">
                {% if let Some(csrf) = layout.csrf_token %}
                    <input type="hidden" name="csrf" value="{{ csrf }}">
                {% endif %}
                <button type="submit">Delete</button>
            </form>
        </div>
    </div>
{% endblock %}
