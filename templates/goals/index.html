{% extends "layout.html" %}
{% block content %}
    <div>
        <div>
            <p>
                <a href="/goals/new">New goal</a>
            </p>
            <form action="/goals/resets/monthly" method="post">
                {% if let Some(csrf) = layout.csrf_token %}
                    <input type="hidden" name="csrf" value="{{ csrf }}">
                {% endif %}
                <button type="submit">Reset monthly goals</button>
            </form>
        </div>
        {% include "goals/_table.html" %}
    </div>
{% endblock %}
